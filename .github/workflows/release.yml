name: Release

# Pushing a semantic version tag (v1.2.3) builds the signed APK and publishes
# a GitHub release for that same tag. The app version comes from the tag, so a
# release can never disagree with what the app reports about itself.
#
# Manual fallback: dispatch the workflow ON THE TAG REF, e.g.
#   gh workflow run release.yml --ref v1.2.3

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: Restore the signing identity
        working-directory: app
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_TYPE: ${{ secrets.ANDROID_KEYSTORE_TYPE }}
        run: |
          # printf avoids shell-added newline quirks when decoding secrets.
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          # Auto-detect store type unless explicitly provided.
          STORE_TYPE="${KEYSTORE_TYPE:-}"
          if [[ -z "$STORE_TYPE" ]]; then
            if keytool -list -keystore android/app/upload-keystore.jks -storetype JKS -storepass "$STORE_PASSWORD" >/dev/null 2>&1; then
              STORE_TYPE="JKS"
            elif keytool -list -keystore android/app/upload-keystore.jks -storetype PKCS12 -storepass "$STORE_PASSWORD" >/dev/null 2>&1; then
              STORE_TYPE="PKCS12"
            else
              echo "Keystore could not be opened as JKS or PKCS12. Check ANDROID_KEYSTORE_BASE64 and ANDROID_STORE_PASSWORD." >&2
              exit 1
            fi
          fi
          # Verify that alias exists before Gradle runs; this gives a clearer error.
          keytool -list \
            -keystore android/app/upload-keystore.jks \
            -storetype "$STORE_TYPE" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          storeType=$STORE_TYPE
          EOF

      - name: Build the signed APK
        working-directory: app
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a semantic version tag like v1.0.0, got: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          # The build number comes from pubspec.yaml, NOT the workflow run
          # counter: dev builds side-loaded during testing carry the pubspec
          # number, and a release with a lower versionCode is a downgrade
          # Android refuses to install over them.
          BUILD_NUMBER="$(sed -n 's/^version:.*+//p' pubspec.yaml)"
          flutter pub get
          flutter build apk --release \
            --build-name="$VERSION" \
            --build-number="$BUILD_NUMBER"
          mv build/app/outputs/flutter-apk/app-release.apk \
             "kiosk-satellite-geckoview-${GITHUB_REF_NAME}.apk"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes

      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "app/kiosk-satellite-geckoview-${GITHUB_REF_NAME}.apk" --clobber
